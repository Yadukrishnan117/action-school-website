<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Action School — Sport Flying Kerala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ══════════════════════════════════════════════
   ACTION SCHOOL v3 — Fixed + Rich Content
   ══════════════════════════════════════════════ */
:root{
  --blue-900:#0a1628;--blue-800:#0d2045;--blue-700:#103265;
  --blue-600:#1a4a8a;--blue-500:#1e6fc0;--blue-400:#3b8fe8;
  --blue-300:#6fb0f5;--blue-200:#b3d5fa;--blue-100:#e8f3fd;
  --orange:#f4802a;--orange-light:#ffa557;
  --white:#fff;--gray-50:#f9fafb;--gray-100:#f3f4f6;
  --gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;
  --gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-900:#111827;
  --green-100:#d1fae5;--green-700:#065f46;--green-400:#6ee7b7;
  --radius-sm:8px;--radius-md:14px;--radius-lg:24px;--radius-full:9999px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.10);
  --shadow-lg:0 12px 40px rgba(0,0,0,.15);--shadow-xl:0 24px 64px rgba(0,0,0,.22);
  --shadow-3d:0 20px 60px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.15);
  --tr:.28s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter','Noto Sans Malayalam',sans-serif;color:var(--gray-900);background:var(--white);line-height:1.65;overflow-x:hidden}
a{text-decoration:none;color:inherit}
ul{list-style:none}
.container{max-width:1140px;margin:0 auto;padding:0 24px}
.section{padding:100px 0}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--radius-full);font-size:.95rem;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all var(--tr);white-space:nowrap;font-family:inherit}
.btn-primary{background:var(--blue-500);color:var(--white);border-color:var(--blue-500)}
.btn-primary:hover{background:var(--blue-600);transform:translateY(-2px) scale(1.02);box-shadow:0 8px 24px rgba(30,111,192,.4)}
.btn-outline{background:transparent;color:var(--white);border-color:rgba(255,255,255,.5)}
.btn-outline:hover{background:rgba(255,255,255,.1);border-color:var(--white)}
.btn-ghost{background:rgba(255,255,255,.12);color:var(--white);border-color:rgba(255,255,255,.3);backdrop-filter:blur(4px)}
.btn-ghost:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}
.btn-orange{background:var(--orange);color:var(--white);border-color:var(--orange)}
.btn-orange:hover{background:#d96a1a;transform:translateY(-2px);box-shadow:0 8px 24px rgba(244,128,42,.4)}
.btn-lg{padding:16px 32px;font-size:1rem}
.btn-sm{padding:8px 16px;font-size:.85rem}
.btn-full{width:100%}
/* Section helpers */
.section-tag{display:inline-block;background:var(--blue-100);color:var(--blue-500);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:var(--radius-full);margin-bottom:16px}
.section-header{text-align:center;max-width:680px;margin:0 auto 64px}
.section-header h2{margin-bottom:14px}
.section-header p{color:var(--gray-500);font-size:1.03rem}
h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;line-height:1.2;color:var(--gray-900);letter-spacing:-.02em}
h3{font-size:1.2rem;font-weight:700;color:var(--gray-900)}
/* Reveal — FIX: instant-visible variant for tab content */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-now{opacity:1 !important;transform:none !important}

/* ═══════════ 3D UTILITIES ═══════════ */
/* FIX: removed .flip-card:hover rule — only .flipped class controls rotation */
.flip-card{perspective:900px;cursor:pointer}
.flip-card-inner{
  position:relative;width:100%;
  transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.4,0,.2,1);
}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}
.flip-front,.flip-back{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-back{position:absolute;inset:0;transform:rotateY(180deg)}
@keyframes float3d{0%,100%{transform:translateY(0) rotateX(2deg) rotateY(-2deg)}33%{transform:translateY(-8px) rotateX(-2deg) rotateY(4deg)}66%{transform:translateY(-5px) rotateX(3deg) rotateY(-3deg)}}
.float-3d{animation:float3d 6s ease-in-out infinite;transform-style:preserve-3d}
@keyframes cardFloat{0%,100%{transform:translateZ(0) translateY(0)}50%{transform:translateZ(8px) translateY(-4px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(30,111,192,.25)}50%{box-shadow:0 0 50px rgba(30,111,192,.5)}}

/* ═══════════ HEADER ═══════════ */
#site-header{position:fixed;top:0;left:0;right:0;z-index:200;transition:background var(--tr),box-shadow var(--tr);padding:12px 0}
#site-header.scrolled{background:rgba(10,22,40,.96);backdrop-filter:blur(20px);box-shadow:0 2px 20px rgba(0,0,0,.3)}
.nav-inner{display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:8px;color:var(--white);font-size:1.15rem;flex-shrink:0;cursor:pointer;transition:transform var(--tr)}
.logo:hover{transform:scale(1.04)}
.logo-icon{font-size:1.4rem;color:var(--orange)}
.logo-text strong{color:var(--orange)}
.nav-list{display:flex;gap:2px;justify-content:center;flex:1}
.nav-list a{color:rgba(255,255,255,.78);font-size:.88rem;font-weight:500;padding:8px 12px;border-radius:var(--radius-full);transition:all var(--tr);display:block}
.nav-list a:hover,.nav-list a.active-nav{color:var(--white);background:rgba(255,255,255,.15)}
.nav-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;z-index:201}
.hamburger span{display:block;width:22px;height:2px;background:var(--white);border-radius:2px;transition:all var(--tr)}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
/* FIX: mobile nav z-index above header, body overflow managed correctly */
.mobile-nav{display:none;position:fixed;inset:0;background:rgba(10,22,40,.97);backdrop-filter:blur(20px);z-index:199;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px}
.mobile-nav.open{display:flex}
.mobile-nav a{color:rgba(255,255,255,.8);font-size:1.15rem;font-weight:600;padding:13px 36px;border-radius:var(--radius-full);transition:all var(--tr);display:block;width:100%;text-align:center;max-width:280px}
.mobile-nav a:hover{color:var(--white);background:rgba(255,255,255,.1)}

/* ═══════════ HERO ═══════════ */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:var(--blue-900)}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(10,22,40,.25) 0%,rgba(10,22,40,.55) 60%,rgba(10,22,40,.88) 100%)}
.hero-content{position:relative;z-index:2;text-align:center;padding-top:100px;max-width:860px;margin:0 auto}
.hero-badge{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.9);font-size:.85rem;font-weight:600;padding:8px 18px;border-radius:var(--radius-full);margin-bottom:28px;backdrop-filter:blur(8px);animation:fadeDown .8s ease}
.hero-headline{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:900;color:var(--white);line-height:1.08;letter-spacing:-.03em;margin-bottom:24px;animation:fadeUp .9s ease .1s both}
.accent{color:var(--orange);display:inline-block;animation:accentPop 1.1s ease .5s both}
@keyframes accentPop{0%{transform:scale(.7) rotate(-5deg);opacity:0}70%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.hero-sub{font-size:clamp(1rem,2vw,1.15rem);color:rgba(255,255,255,.78);max-width:620px;margin:0 auto 44px;animation:fadeUp .9s ease .2s both}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:60px;animation:fadeUp .9s ease .3s both}
.hero-stats{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(16px);border-radius:var(--radius-lg);padding:22px 36px;animation:fadeUp .9s ease .4s both}
.stat{display:flex;flex-direction:column;align-items:center;padding:0 32px}
.stat-num{font-size:1.9rem;font-weight:800;color:var(--white);line-height:1;margin-bottom:5px}
.stat-label{font-size:.73rem;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em}
.stat-divider{width:1px;height:44px;background:rgba(255,255,255,.15)}
.scroll-ind{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:2}
.scroll-ind span{display:block;width:24px;height:38px;border:2px solid rgba(255,255,255,.3);border-radius:12px;position:relative}
.scroll-ind span::after{content:'';position:absolute;width:4px;height:8px;background:rgba(255,255,255,.5);border-radius:2px;top:6px;left:50%;transform:translateX(-50%);animation:bob 2s ease infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);opacity:1}50%{transform:translateX(-50%) translateY(10px);opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* ═══════════ ABOUT ═══════════ */
.about-section{background:var(--white)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.about-card-stack{position:relative;height:420px;perspective:900px}
.about-img-card{position:absolute;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-xl)}
.card-1{width:70%;height:260px;top:0;left:0;background:linear-gradient(135deg,var(--blue-800),var(--blue-600));animation:cardFloat 7s ease-in-out infinite}
.card-2{width:62%;height:200px;bottom:40px;right:0;background:linear-gradient(135deg,var(--blue-500),var(--blue-300));animation:cardFloat 9s ease-in-out 1s infinite}
.card-3{width:42%;height:150px;top:50%;left:50%;transform:translate(-50%,-50%) translateZ(30px);background:linear-gradient(135deg,var(--orange),var(--orange-light));z-index:2;animation:cardFloat 5s ease-in-out 2s infinite}
.img-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.plane-icon{font-size:2.2rem}
.img-placeholder p{color:rgba(255,255,255,.8);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.location-badge{position:absolute;bottom:8px;left:0;background:var(--white);border-radius:var(--radius-full);padding:8px 16px;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--gray-700);box-shadow:var(--shadow-md);z-index:3;white-space:nowrap}
.about-content p{color:var(--gray-600);margin-bottom:18px;font-size:1.01rem}
.about-content p strong{color:var(--blue-500)}
.about-pillars{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.pillar{display:flex;align-items:center;gap:8px;background:var(--blue-100);color:var(--blue-700);font-size:.83rem;font-weight:600;padding:8px 14px;border-radius:var(--radius-full);transition:transform var(--tr)}
.pillar:hover{transform:translateY(-2px) scale(1.03)}

/* ═══════════ FLYING ACTIVITIES ═══════════ */
.flying-section{background:var(--gray-50)}
.flying-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-bottom:48px}
.activity-flip{height:340px}
.activity-flip .flip-card-inner{height:100%}
.flip-front{width:100%;height:100%;border-radius:var(--radius-lg);overflow:hidden;background:var(--white);border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.flip-back{width:100%;height:100%;border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:10px}
.flip-back.ultra{background:linear-gradient(145deg,var(--blue-800),var(--blue-500))}
.flip-back.para{background:linear-gradient(145deg,#0e5f78,#2ab9e0)}
.flip-back.gyro{background:linear-gradient(145deg,#c05a00,var(--orange))}
.flip-back h3{color:var(--white);font-size:1.25rem}
.flip-back p{color:rgba(255,255,255,.85);font-size:.9rem;line-height:1.6}
.back-tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.back-tags span{background:rgba(255,255,255,.18);color:var(--white);font-size:.73rem;font-weight:600;padding:4px 11px;border-radius:var(--radius-full)}
.flip-hint{font-size:.7rem;color:rgba(255,255,255,.55);margin-top:4px}
.flip-indicator{position:absolute;top:10px;right:12px;font-size:.7rem;color:var(--gray-400);font-weight:500;display:flex;align-items:center;gap:4px}
.activity-icon-wrap{height:140px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
.activity-icon-wrap::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.18),transparent 60%)}
.activity-icon-wrap.ultra{background:linear-gradient(135deg,var(--blue-800),var(--blue-600))}
.activity-icon-wrap.para{background:linear-gradient(135deg,#1a7fa0,#2ab9e0)}
.activity-icon-wrap.gyro{background:linear-gradient(135deg,var(--orange),#f5b942)}
.act-icon-3d{font-size:3.6rem;animation:float3d 5s ease-in-out infinite;display:inline-block}
.activity-content{padding:20px 22px 22px;flex:1;display:flex;flex-direction:column;position:relative}
.activity-badge{display:inline-block;background:var(--orange);color:var(--white);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:var(--radius-full);margin-bottom:10px}
.activity-content h3{margin-bottom:8px;font-size:1.1rem}
.activity-content>p{color:var(--gray-500);font-size:.9rem;margin-bottom:auto}
.activity-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.activity-tags span{background:var(--blue-100);color:var(--blue-700);font-size:.72rem;font-weight:600;padding:4px 11px;border-radius:var(--radius-full)}
.cta-center{text-align:center}

/* ═══════════ YOUTH ACTIVITIES (TABBED) ═══════════ */
.ya-section{background:var(--white)}
.ya-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:52px;background:var(--gray-100);padding:6px;border-radius:var(--radius-full);width:fit-content;margin-left:auto;margin-right:auto;flex-wrap:wrap}
.ya-tab{padding:10px 22px;border-radius:var(--radius-full);border:none;background:transparent;font-size:.88rem;font-weight:600;color:var(--gray-500);cursor:pointer;transition:all var(--tr);font-family:inherit}
.ya-tab.active{background:var(--blue-500);color:var(--white);box-shadow:0 4px 14px rgba(30,111,192,.3)}
.ya-tab:hover:not(.active){color:var(--gray-700);background:var(--gray-200)}
.ya-pane{animation:fadeUp .4s ease both}

/* Mission tab */
.youth-inner{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center}
.youth-text p{color:var(--gray-600);margin-bottom:26px;font-size:1.02rem}
.youth-benefits{margin-bottom:32px}
.youth-benefits li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;font-size:.94rem;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
.youth-benefits li:last-child{border-bottom:none}
.check{width:22px;height:22px;background:var(--orange);color:var(--white);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;margin-top:2px}
.sky-circle{width:300px;height:300px;border-radius:50%;background:linear-gradient(135deg,var(--blue-100),var(--blue-200));border:2px solid var(--blue-300);position:relative;display:flex;align-items:center;justify-content:center;animation:glowPulse 4s ease-in-out infinite}
.orbit{position:absolute;border-radius:50%;border:1px dashed rgba(30,111,192,.2)}
.orbit-1{width:100%;height:100%;animation:spin 12s linear infinite}
.orbit-2{width:72%;height:72%;animation:spin 18s linear infinite reverse}
.orbit-3{width:44%;height:44%;animation:spin 8s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.orbit-dot{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:30px;height:30px;background:var(--blue-500);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 4px 12px rgba(30,111,192,.4)}
.sky-center{position:absolute;text-align:center;z-index:2}
.sky-text{display:block;font-size:1.9rem;font-weight:900;color:var(--blue-700);letter-spacing:.08em}
.sky-sub{display:block;font-size:.65rem;font-weight:700;color:var(--blue-500);letter-spacing:.15em;text-transform:uppercase;margin-top:4px}

/* Plans tab */
.pkg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;perspective:1200px}
.pkg-card{
  background:var(--gray-50);border:2px solid var(--gray-200);
  border-radius:var(--radius-lg);padding:30px 24px;
  text-align:center;position:relative;
  transform-style:preserve-3d;
  transition:transform .12s ease,box-shadow .12s ease,border-color .2s;
  cursor:default;
}
.pkg-card:hover{border-color:var(--blue-300);box-shadow:var(--shadow-3d)}
.pkg-card.featured{background:linear-gradient(160deg,var(--blue-900),var(--blue-700));border-color:var(--blue-500)}
.pkg-card.featured h3,.pkg-card.featured .pkg-name{color:var(--white)}
.pkg-card.featured .pkg-price-note{color:rgba(255,255,255,.6)}
.pkg-card.featured .pkg-price{color:var(--orange-light)}
.pkg-card.featured .pkg-feat li{color:rgba(255,255,255,.8);border-bottom-color:rgba(255,255,255,.1)}
.popular-tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--orange);color:var(--white);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:5px 16px;border-radius:var(--radius-full);white-space:nowrap}
.pkg-icon{font-size:2.6rem;margin-bottom:14px;display:inline-block;animation:float3d 6s ease-in-out infinite}
.pkg-name{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--blue-500);margin-bottom:8px}
.pkg-price{font-size:2.1rem;font-weight:900;color:var(--blue-700);line-height:1;margin-bottom:4px}
.pkg-price-note{font-size:.77rem;color:var(--gray-500);margin-bottom:18px}
.pkg-feat{margin-bottom:22px;text-align:left}
.pkg-feat li{padding:6px 0;border-bottom:1px solid rgba(0,0,0,.05);font-size:.86rem;color:var(--gray-700);display:flex;align-items:center;gap:8px}
.pkg-feat li::before{content:'✓';color:var(--orange);font-weight:700;flex-shrink:0}
.pkg-card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,transparent 50%);pointer-events:none;z-index:1}

/* Experiences tab */
.exp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.exp-card{
  background:var(--gray-50);border:1px solid var(--gray-200);
  border-radius:var(--radius-lg);padding:24px;
  display:flex;gap:18px;align-items:flex-start;
  transition:transform var(--tr),box-shadow var(--tr);
  transform-style:preserve-3d;cursor:default;
}
.exp-card:hover{transform:translateY(-5px) rotateX(2deg);box-shadow:var(--shadow-xl)}
.exp-icon-wrap{width:52px;height:52px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.exp-icon-wrap.blue{background:var(--blue-100)}
.exp-icon-wrap.orange{background:#fff3e8}
.exp-icon-wrap.green{background:#e8f5e9}
.exp-icon-wrap.purple{background:#f3e8ff}
.exp-icon-wrap.teal{background:#e0f7fa}
.exp-icon-wrap.red{background:#fef2f2}
.exp-content h4{font-size:.98rem;font-weight:700;margin-bottom:6px;color:var(--gray-900)}
.exp-content p{font-size:.86rem;color:var(--gray-500);line-height:1.6;margin-bottom:10px}
.exp-steps{margin:8px 0 10px;padding-left:0}
.exp-steps li{font-size:.82rem;color:var(--gray-600);padding:3px 0;display:flex;gap:8px;align-items:flex-start}

.map-legend-s{display:block;font-size:.66rem;font-weight:600;color:var(--blue-500);text-transform:uppercase;letter-spacing:.06em}

.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.scene-card{

.scene-card:hover .scene-overlay{opacity:1}

  position:absolute;inset:0;z-index:10;
  background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 50%);

  display:flex;flex-direction:column;justify-content:flex-end;padding:20px;
}

  padding:4px 12px;border-radius:var(--radius-full);margin-bottom:8px;width:fit-content;
}

/* ── Animations for flying figures ── */
@keyframes glide{
  0%,100%{transform:translateX(0) translateY(0) rotate(-3deg)}
  25%{transform:translateX(12px) translateY(-8px) rotate(0deg)}
  50%{transform:translateX(22px) translateY(-4px) rotate(3deg)}
  75%{transform:translateX(10px) translateY(-10px) rotate(-1deg)}
}
@keyframes soar{
  0%,100%{transform:translateX(-20px) translateY(0)}
  50%{transform:translateX(20px) translateY(-12px)}
}
@keyframes bankTurn{
  0%,100%{transform:rotate(-5deg) translateY(0)}
  40%{transform:rotate(8deg) translateY(-6px)}
  70%{transform:rotate(-2deg) translateY(-10px)}
}
@keyframes hover-bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@keyframes propSpin{
  from{transform-origin:center;transform:rotate(0deg)}
  to{transform-origin:center;transform:rotate(360deg)}
}
@keyframes rotorSpin{
  from{transform:rotate(0deg)}to{transform:rotate(360deg)}
}
@keyframes trailFade{
  0%{stroke-dashoffset:200;opacity:.8}
  100%{stroke-dashoffset:0;opacity:0}
}
@keyframes cloudDrift{
  0%{transform:translateX(0)}100%{transform:translateX(60px)}
}
@keyframes wingPulse{
  0%,100%{transform:scaleX(1) scaleY(1)}
  50%{transform:scaleX(1.04) scaleY(.97)}
}
@keyframes personSway{
  0%,100%{transform:rotate(-2deg)}
  50%{transform:rotate(2deg)}
}
@keyframes birdFlap{
  0%,100%{transform:rotateX(0deg)}
  50%{transform:rotateX(20deg)}
}

.scene-sky-sunset{background:linear-gradient(180deg,#0a1628 0%,#8b2fc9 25%,#f4802a 60%,#ffd27f 100%)}
.scene-sky-dusk{background:linear-gradient(180deg,#1a0533 0%,#2d1b69 30%,#1e6fc0 65%,#3b8fe8 100%)}

/* Gallery figure wrappers */

.fig-paramotor{top:35%;left:15%;animation:glide 6s ease-in-out infinite}
.fig-ultralight{top:30%;left:20%;animation:bankTurn 7s ease-in-out infinite}
.fig-gyro{top:38%;left:18%;animation:hover-bob 4s ease-in-out infinite}

.scene-hills{position:absolute;bottom:50px;left:0;right:0}
.scene-city{position:absolute;bottom:0;left:0;right:0}

@media(max-width:900px){.gallery-grid{grid-template-columns:1fr 1fr}}

  100%{background-position:0% 50%}

.gallery-section{
  background:linear-gradient(135deg,#0a1628,#0d2045,#103265,#0d2045,#0a1628);

}

/* ════════════════════════════════════
   THREE.JS HERO — FIX: use window size
   ════════════════════════════════════ */
function initThreeHero(canvas) {
  // FIX: use window dimensions, not canvas.clientWidth which may be 0
  const W = window.innerWidth, H = window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 1000);
  camera.position.z = 5;

  // Stars
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(2000 * 3);
  for (let i = 0; i < 2000 * 3; i++) starPos[i] = (Math.random() - 0.5) * 40;
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.055, transparent: true, opacity: 0.7 });
  scene.add(new THREE.Points(starGeo, starMat));

  // Rings
  const rings = [];
  [0x1e6fc0, 0x3b8fe8, 0xf4802a].forEach((col, i) => {
    const geo = new THREE.TorusGeometry(2.2 + i * 1.4, 0.014, 8, 80);
    const mat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.16 - i * 0.02 });
    const ring = new THREE.Mesh(geo, mat);
    ring.rotation.x = Math.PI / 3 + i * 0.3;
    ring.rotation.y = i * 0.8;
    scene.add(ring); rings.push(ring);
  });

  // Cloud spheres
  const spheres = [];
  for (let i = 0; i < 10; i++) {
    const r = 0.06 + Math.random() * 0.18;
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(r, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.05 + Math.random() * 0.07 })
    );
    mesh.position.set((Math.random()-0.5)*14,(Math.random()-0.5)*8,(Math.random()-0.5)*6-2);
    mesh.userData = { vy:(Math.random()-.5)*.002, vx:(Math.random()-.5)*.001 };
    scene.add(mesh); spheres.push(mesh);
  }

  // Trail
  const pts = [];
  for (let i = 0; i < 60; i++) pts.push(new THREE.Vector3(-6+i*0.2, Math.sin(i*0.15)*0.3, 0));
  const trail = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x6fb0f5, transparent: true, opacity: 0.28 })
  );
  scene.add(trail);

  let frame, t = 0;
  const animate = () => {
    frame = requestAnimationFrame(animate);
    t += 0.006;
    rings.forEach((r,i) => { r.rotation.z += 0.0008+i*0.0004; r.rotation.x += 0.0003; });
    spheres.forEach(s => {
      s.position.y += s.userData.vy; s.position.x += s.userData.vx;
      if (Math.abs(s.position.y) > 5) s.userData.vy *= -1;
      if (Math.abs(s.position.x) > 8) s.userData.vx *= -1;
    });
    trail.position.x = Math.sin(t*.5)*1.5; trail.position.y = Math.cos(t*.3)*.8;
    trail.rotation.z = Math.sin(t*.4)*.15;
    starMat.opacity = 0.5 + Math.sin(t)*.15;
    renderer.render(scene, camera);
  };
  animate();

  const onResize = () => {
    const nW = window.innerWidth, nH = window.innerHeight;
    renderer.setSize(nW, nH); camera.aspect = nW/nH; camera.updateProjectionMatrix();
  };
  window.addEventListener('resize', onResize);
  return () => { cancelAnimationFrame(frame); window.removeEventListener('resize', onResize); renderer.dispose(); };
}

/* ════════════════════════════════════
   TILT HOOK (FIX: prevent button events)
   ════════════════════════════════════ */
function useTilt(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const onMove = (e) => {
      // FIX: skip tilt if the event target is a button (prevents tilt during Book Now click)
      if (e.target && e.target.closest('button')) return;
      const rect = el.getBoundingClientRect();
      const dx = (e.clientX - (rect.left + rect.width/2)) / (rect.width/2);
      const dy = (e.clientY - (rect.top + rect.height/2)) / (rect.height/2);
      el.style.transform = `perspective(800px) rotateY(${dx*10}deg) rotateX(${-dy*10}deg) translateZ(8px)`;
    };
    const onLeave = () => { el.style.transform = ''; };
    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    return () => { el.removeEventListener('mousemove', onMove); el.removeEventListener('mouseleave', onLeave); };
  }, []);
}

/* ════════════════════════════════════
   FIX: Reveal hook with dep array []
   Tab items use inline .reveal-now instead
   ════════════════════════════════════ */
function useReveal() {
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const siblings = e.target.parentElement
          ? Array.from(e.target.parentElement.querySelectorAll('.reveal:not(.visible)')) : [];
        setTimeout(() => e.target.classList.add('visible'), Math.max(0, siblings.indexOf(e.target)*100));
        obs.unobserve(e.target);
      });
    }, { threshold: 0.1, rootMargin:'0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []); // FIX: [] dep array — runs once, stable observer
}

/* FIX: Force-reveal elements inside dynamically shown tab panes */
function useTabReveal(activeTab) {
  useEffect(() => {
    // After tab switch, immediately make new .reveal items visible (they're in viewport)
    const timer = setTimeout(() => {
      document.querySelectorAll('.ya-pane .reveal:not(.visible)').forEach(el => {
        el.classList.add('visible');
      });
    }, 50);
    return () => clearTimeout(timer);
  }, [activeTab]);
}

/* ════════════════════════════════════
   SCROLL HELPER (shared)
   ════════════════════════════════════ */
function scrollTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const offset = el.getBoundingClientRect().top + window.scrollY - 72;
  window.scrollTo({ top: offset, behavior: 'smooth' });
}

/* ════════════════════════════════════
   CONTACT  FIX: form ref + stable reset
   ════════════════════════════════════ */
function Contact({ lang }) {
  const t = T[lang];
  const [ok, setOk] = useState(false);
  const formRef = useRef();

  const submit = useCallback((e) => {
    e.preventDefault();
    setOk(true);
    // FIX: use ref for reset instead of stale e.target
    setTimeout(() => { setOk(false); formRef.current?.reset(); }, 5000);
  }, []);

  return (
    <section id="contact" className="section contact-section">
      <div className="container">
        <div className="contact-grid">
          <div className="contact-info reveal">
            <div className="section-tag">{t.contact_tag}</div>
            <h2>{t.contact_h2}</h2>
            <p>{t.contact_p}</p>
            <div className="contact-details">
              {t.contact_items.map((item,i) => (
                <div className="contact-item" key={i}>
                  <span className="contact-icon">{item.icon}</span>
                  <div>
                    <span className="c-label">{item.label}</span>
                    {item.link
                      ? <a href={item.link} className="c-val c-link">{item.value}</a>
                      : <span className="c-val">{item.value}</span>}
                  </div>
                </div>
              ))}
            </div>
            <div className="social-links">
              {[['📷','Instagram'],['👍','Facebook'],['▶️','YouTube']].map(([ic,n]) => (
                <button className="social-btn" key={n}><span>{ic}</span><span>{n}</span></button>
              ))}
            </div>
          </div>

          <form ref={formRef} className="contact-form reveal" onSubmit={submit}>
            <h3>{t.form_h3}</h3>
            {ok && <div className="form-ok">{t.form_success}</div>}
            <div className="form-group"><label>{t.form_name}</label><input type="text" placeholder="Your name" required/></div>
            <div className="form-group"><label>{t.form_email}</label><input type="text" placeholder="+91 98765 43210 or email@example.com" required/></div>
            <div className="form-group">
              <label>{t.form_activity}</label>
              <select>{t.form_opts.map((o,i)=><option key={i} value={o}>{o}</option>)}</select>
            </div>
            <div className="form-group">
              <label>{t.form_msg}</label>
              <textarea rows="4" placeholder={lang==='en'?'Tell us about your flying goals...':'നിങ്ങളുടെ flying goal പറയൂ...'}/>
            </div>
            <button type="submit" className="btn btn-primary btn-full">{t.form_btn}</button>
          </form>
        </div>
      </div>
    </section>
  );
}

              <g opacity=".25" style={{animation:'cloudDrift 9s ease-in-out infinite alternate 4s'}}>
                <path d="M280,75 Q310,65 340,72 Q360,62 380,70 Q355,82 310,85Z" fill="#f4802a"/>
              </g>
              {/* City silhouette */}
              <path d="M0,238 L0,300 L30,300 L30,225 L40,225 L40,215 L50,215 L50,220 L60,220 L60,230 L80,230 L80,210 L90,210 L90,200 L100,200 L100,215 L115,215 L115,235 L130,235 L130,215 L140,215 L140,205 L150,205 L150,200 L165,200 L165,218 L180,218 L180,230 L200,230 L200,215 L210,215 L210,210 L225,210 L225,215 L240,215 L240,225 L255,225 L255,208 L265,208 L265,198 L280,198 L280,208 L295,208 L295,220 L310,220 L310,235 L330,235 L330,215 L345,215 L345,205 L358,205 L358,215 L375,215 L375,228 L390,228 L390,218 L400,218 L400,230 L420,230 L420,300 L0,300Z"
                    fill="url(#horizon3)"/>
              {/* Building windows */}
              {[[92,206],[94,212],[105,205],[105,211],[145,208],[145,214],[212,214],[267,202],[267,208],[282,202]].map(([x,y],i)=>(
                <rect key={i} x={x} y={y} width="4" height="4" fill="#fbbf24" opacity={.5+Math.sin(i)*.3}/>
              ))}
              {/* ── GYROCOPTER ── */}
              <g style={{animation:'hover-bob 5s ease-in-out infinite',transformOrigin:'210px 155px'}}>
                {/* Rotor disc (blur effect) */}
                <ellipse cx="210" cy="118" rx="65" ry="8" fill="none"
                         stroke="rgba(255,255,255,.12)" strokeWidth="8"/>
                {/* Spinning rotor blades */}
                <g style={{transformOrigin:'210px 118px',animation:'rotorSpin .6s linear infinite'}}>
                  <line x1="145" y1="118" x2="275" y2="118" stroke="rgba(255,255,255,.6)" strokeWidth="3" strokeLinecap="round"/>
                  <line x1="175" y1="88" x2="245" y2="148" stroke="rgba(255,255,255,.4)" strokeWidth="2" strokeLinecap="round"/>
                </g>
                {/* Rotor hub */}
                <circle cx="210" cy="118" r="7" fill="#f4802a"/>
                <circle cx="210" cy="118" r="4" fill="#ffa557"/>
                {/* Rotor mast */}
                <line x1="210" y1="124" x2="210" y2="140" stroke="#b3d5fa" strokeWidth="3"/>
                {/* Main pod / cockpit */}
                <path d="M175,140 Q190,132 210,134 Q230,132 245,140 Q235,162 210,165 Q185,162 175,140Z"
                      fill="#1e6fc0" opacity=".9"/>
                {/* Cockpit glass */}
                <path d="M183,140 Q198,133 210,135 Q222,133 237,140 Q225,155 210,157 Q195,155 183,140Z"
                      fill="#6fb0f5" opacity=".45"/>
                {/* Pilot 1 (left seat) */}
                <circle cx="200" cy="143" r="6" fill="#f4802a"/>
                <ellipse cx="200" cy="143" rx="4" ry="3" fill="#0d2045" opacity=".5"/>
                {/* Pilot 2 (right seat) */}
                <circle cx="220" cy="143" r="5.5" fill="#ffa557"/>
                <ellipse cx="220" cy="143" rx="3.5" ry="2.5" fill="#0d2045" opacity=".45"/>
                {/* Pilot arms waving */}
                <path d="M196,148 Q188,140 182,144" stroke="#f4802a" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
                <path d="M224,148 Q232,140 238,144" stroke="#ffa557" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
                {/* Landing skids */}
                <path d="M180,163 L178,175 L242,175 L240,163" stroke="#3b8fe8" strokeWidth="2.5" fill="none"/>
                <path d="M185,175 L185,182 L205,182" stroke="#3b8fe8" strokeWidth="2" fill="none"/>
                <path d="M235,175 L235,182 L215,182" stroke="#3b8fe8" strokeWidth="2" fill="none"/>
                {/* Small tail fin */}
                <path d="M243,148 L265,140 L262,155 Z" fill="#1e6fc0" opacity=".7"/>
                {/* Anti-torque small rotor */}
                <g style={{transformOrigin:'264px 147px',animation:'rotorSpin .35s linear infinite reverse'}}>
                  <line x1="264" y1="140" x2="264" y2="154" stroke="rgba(255,255,255,.5)" strokeWidth="2" strokeLinecap="round"/>
                </g>
                {/* Motion trail blur */}
                <path d="M180,155 Q160,155 140,158 Q120,161 100,158"
                      stroke="rgba(255,165,0,.15)" strokeWidth="4" fill="none" strokeLinecap="round"/>
              </g>
            </svg>
            <div className="scene-overlay">
              <div className="scene-badge">🚁 Gyrocopter</div>
              <h3>{isML?'സൂര്യാസ്തമയ ആകാശം':'Sunset Over the City'}</h3>
              <p>{isML?'തിരുവനന്തപുരം നഗരം ആകാശ ദൃശ്യം':'Thiruvananthapuram skyline from a Gyrocopter'}</p>
            </div>
          </div>

        </div>{/* gallery-grid */}

        {/* Stats bar */}
        <div className="gallery-stats reveal">
          {stats.map(([num, label], i) => (
            <div className="gallery-stat" key={i}>
              <span className="g-stat-num">{num}</span>
              <span className="g-stat-label">{label}</span>
            </div>
          ))}
        </div>

      </div>
    </section>
  );
}

function Footer({ lang }) {
  const t = T[lang];

    {label:lang==='en'?'Activities':'ഫ്ലൈയിംഗ്', id:'flying'},
    {label:lang==='en'?'Youth Activities':'യൂത്ത്',id:'youth-activities'},
    {label:lang==='en'?'Contact':'ബന്ധം',          id:'contact'},
  ];
  return (
    <footer className="site-footer">
      <div className="container footer-inner">
        <div className="footer-brand">
          <div className="logo"><span className="logo-icon">✈</span><span className="logo-text">Action<strong>School</strong></span></div>
          <p style={{whiteSpace:'pre-line'}}>{t.footer_tagline}</p>
        </div>
        <div className="footer-links">
          <h4>{t.footer_nav}</h4>
          <ul>
            {/* FIX: use scrollTo with offset for all footer links */}
            {links.map(l => (
              <li key={l.id}>
                <button onClick={() => scrollTo(l.id)}>{l.label}</button>
              </li>
            ))}
          </ul>
        </div>
        <div className="footer-contact">
          <h4>{t.footer_contact}</h4>
          <p>Mr. Arjun</p>
          <p>{lang==='en'?'Thiruvananthapuram, Kerala':'തിരുവനന്തപുരം, കേരളം'}</p>
          <a href="mailto:info@actionschool.in">info@actionschool.in</a>
        </div>
      </div>
      <div className="footer-bottom"><p>{t.footer_bottom}</p></div>
    </footer>
  );
}

function App() {
  const [lang, setLang] = useState('en');
  useReveal();
  useEffect(() => { document.documentElement.lang = lang==='ml'?'ml':'en'; }, [lang]);
  return (
    <>
      <Header lang={lang} setLang={setLang}/>
      <main>
        <Hero             lang={lang}/>
        <About            lang={lang}/>
        <FlyingGallery    lang={lang}/>
        <FlyingActivities lang={lang}/>
        <YouthActivities  lang={lang}/>
        <Partners         lang={lang}/>
        <AeroParks        lang={lang}/>
        <Contact          lang={lang}/>
      </main>
      <Footer lang={lang}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
